[package]
name = "gsea"
version = "0.1.0"
edition = "2021"
description = "Gemma Self-Evolving Agent — local LLM agent with persistent MemoryBrain"
authors = ["Paul Yu <paul.yu@coreon.ai>"]
license = "MIT"
repository = "https://github.com/yhc007/gsea"
keywords = ["llm", "agent", "memory", "rust", "evolution"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["memory/*.db", "sessions/*.json", "evolution_sandbox/*"]

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
rustyline = "14"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
eframe = "0.31"
urlencoding = "2"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }

# pekko-agent dependencies
pekko-actor = { path = "../rust-pekko/pekko-actor" }
memory-actor = { path = "vendor/memory-brain/crates/memory-actor" }
pekko-agent-core = { path = "../pekko-agent/crates/pekko-agent-core" }
pekko-agent-memory = { path = "../pekko-agent/crates/pekko-agent-memory" }
pekko-agent-tools = { path = "../pekko-agent/crates/pekko-agent-tools" }
pekko-agent-orchestrator = { path = "../pekko-agent/crates/pekko-agent-orchestrator" }
pekko-agent-events = { path = "../pekko-agent/crates/pekko-agent-events" }
pekko-event-bus = { path = "../rust-pekko/pekko-event-bus" }

# monitoring
monitoring-core = { path = "../core-agent-monitoring/crates/monitoring-core" }
monitoring-bridge = { path = "../core-agent-monitoring/crates/monitoring-bridge" }
monitoring-exporter = { path = "../core-agent-monitoring/crates/monitoring-exporter" }

[dev-dependencies]
tempfile = "3"
